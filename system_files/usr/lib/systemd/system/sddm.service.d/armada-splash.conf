# Stop the boot splash as the display manager takes the screen; Conflicts= on
# the splash unit would delete sddm's start job from the boot transaction.
[Service]
ExecStartPre=-/usr/bin/systemctl stop --no-block armada-splash-early.service
# The DRM drawer holds the master (else kernel fbdev steals scanout); this
# write is its deactivate handshake, yielding the display to the session.
ExecStartPre=-/bin/sh -c "echo sddm > /run/armada/takeover"
